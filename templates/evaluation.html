<!DOCTYPE html>
<html lang="zh_cn">
<head>
    {% include 'head.html' %}
    <title>ScoreSYS-摄影比赛评审平台</title>    
    <script>
        var session_id = $.cookie('session');
        var cid = parseInt("{{cid}}");


        var day = 0;
        $.ajax({
            url: "/api/v1/day",
            method: "GET",
            headers: {
                "Content-Type": "application/json",
                "X-Session-ID": session_id,
            },
        }).done((response) => {
            day = response.data;
        });

        // 图片信息
        // $.ajax({
        //     url: "/api/v1/com/info",
        //     method: "POST",
        //     headers: {
        //         "Content-Type": "application/json",
        //         "X-Session-ID": session_id,
        //     },
        //     data: JSON.stringify({ "cid": "{{cid}}" }),
        // }).done((response) => {
        //     if (response.success){
        //         $("#daynum").text("第" + day + "天 (" + (parseInt("{{cid}}") % 50) + "/50)");
        //         $("#image").attr("src", "/uploads/" + response.path[0]);
        //     }
        // });

        var logout = function(){
            $.removeCookie('session');
            window.location.href = "/";
        }
    </script>
</head>
<body>
<div class="app">
    <div class="z-40 w-full mb-3">
        <div class="max-w-8xl mx-auto text-lg">
          <div class="py-4 border-b border-slate-900/10 lg:px-1 lg:border-0 dark:border-slate-300/10 mx-4 lg:mx-0">
            <div class="flex justify-between items-center">
                <img src="/favicon.ico" alt="Logo" width="32" height="32" onclick="window.location.href='/'">
                <h6 class="text-4xl font-bold">ScoreSYS-摄影比赛评审平台</h6>
                <div class="flex items-center">
                    <div class="" id="logout_button" onclick="logout()"></div>
                    <button class="ui blue button ml-2" id="help_button">帮助</button>
                </div>
            </div>
          </div>
        </div>
    </div>

    <div class="flex flex-col flex-grow justify-center items-center mb-10">
        <div class="flex flex-col items-center w-full mb-3" style="width: 90%;">
            <h1 class="text-3xl font-bold" id="daynum"></h1>
        </div>

        <div class="flex justify-end mb-3">
            <button id="prev_button" class="ui basic red icon button">
                <i class="angle double left icon"></i>
            </button>
            
            <!-- 评分按钮 -->
            <div id="score_buttons" class="ui buttons ml-2 mr-2">
                <button class="ui button score-btn" data-score="1">1分</button>
                <button class="ui button score-btn" data-score="2">2分</button>
                <button class="ui button score-btn" data-score="3">3分</button>
                <button class="ui button score-btn" data-score="4">4分</button>
                <button class="ui button score-btn" data-score="5">5分</button>
            </div>
            
            <!-- YourLife按钮 -->
            <button id="interesting_button" class="ui blue button">YourLife</button>
            
            <button id="next_button" class="ui basic red icon button">
                <i class="angle double right icon"></i>
            </button>
        </div>

        <div class="flex flex-col items-center w-full mb-5" style="width: 95%;">
            <img id="image" class="ui bordered fluid image" src="">
        </div>

    </div>
</div>

    </div>
</div>

<!-- 帮助模态框 -->
<div class="ui modal" id="help_modal">
    <div class="header">
        <h3>帮助信息</h3>
    </div>
    <div class="content">
        <p>欢迎使用 <b>ScoreSYS</b> 社团自研摄影比赛评审平台</p>
        <ul>
            <li>点击1-5分按钮给照片评分</li>
            <li>点击 "YourLife" 按钮为照片增加YourLife榜单指数</li>
            <li>公开评审限评30张，注册评审限评50 张</li>
            <li>点击左右箭头切换下一张照片。</li>
        </ul>
    </div>
    <div class="actions">
        <div class="ui approve button">我知道了</div>
    </div>
</div>

<script>
    // 打分按钮事件
    $(".score-btn").on("click", function() {
        let score = parseInt($(this).data("score"));
        $.ajax({
            url: "/api/v1/vote/query",
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Session-ID": $.cookie('token'),
            },
            data: JSON.stringify({
                "cid": cid,
                "score": score
            }),
        }).done((response) => {
            $(".score-btn").removeClass("green"); // 重置颜色
            $(this).addClass("green");
            if (response.success) {
                alert("已打分：" + score + " 分！");
            } else {
                alert(response.data.message || "打分失败");
            }
        });
    });

    // YourLife按钮
    $("#interesting_button").on("click", function() {
        let isActive = $(this).hasClass("green");
        $.ajax({
            url: "/api/v1/vote/yourlife",
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Session-ID": $.cookie('token'),
            },
            data: JSON.stringify({
                "cid": cid,
                "score": 5,
                "interesting": !isActive
            }),
        }).done((response) => {
            $(this).toggleClass("green");
            $(this).text(isActive ? "YourLife" : "OurLife");
            if (response.success) {
                if (isActive) {
                    $(this).removeClass("green");
                } else {
                    $(this).addClass("green");
                }
            } else {
                alert(response.data.message || "操作失败");
            }
        });
    });

    // 帮助按钮
    $("#help_button").on("click", () => {
        console.log("Help button clicked");
        $("#help_modal")
            .modal({ blurring: true, observeChanges: true })
            .modal("show");
    });

    // 翻页按钮
    $("#prev_button").on("click", () => {
        window.location.href = "/evaluation/" + (cid - 1);
    });
    $("#next_button").on("click", () => {
        window.location.href = "/evaluation/" + (cid + 1);
    });
</script>
</body>
</html>
